# ---------------------------------------------------------------------------
# URLPulse full stack
#
#   nginx -> app -> mongo (data) + redis (cache)
#   prometheus scrapes app:5000/metrics;  grafana reads prometheus
#
# This file is the shared base. Compose merges a second file on top of it:
#   docker compose up -d --build            base + docker-compose.override.yml (dev, automatic)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d    production
#
# Secrets come from .env (run `make init` to generate one). Variables written as
# ${NAME:?message} are required: Compose refuses to start without them.
# ---------------------------------------------------------------------------
name: urlpulse

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginxinc/nginx-unprivileged:${NGINX_TAG:-stable-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging: *default-logging

  app:
    image: ${IMAGE:-urlpulse}:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5000"
      BASE_URL: ${BASE_URL:-}
      TRUST_PROXY: "1" # exactly one proxy (nginx) sits in front of the app
      MONGO_URI: mongodb://${MONGO_USER:-urlpulse}:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env (run make init)}@mongo:27017/urlpulse?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (run make init)}@redis:6379
      HASH_SALT: ${HASH_SALT:?Set HASH_SALT in .env (run make init)}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      READ_RATE_LIMIT_MAX: ${READ_RATE_LIMIT_MAX:-600}
      MONITOR_ENABLED: ${MONITOR_ENABLED:-true}
      CLICK_RETENTION_DAYS: ${CLICK_RETENTION_DAYS:-90}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Hardening: nothing in the app writes to disk
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [edge, data]
    logging: *default-logging

  mongo:
    image: mongo:${MONGO_TAG:-8}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-urlpulse}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env (run make init)}
    volumes:
      - mongo-data:/data/db
    networks: [data]
    healthcheck:
      # ping needs no authentication
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:${REDIS_TAG:-7-alpine}
    restart: unless-stopped
    # Cache only: evict least-recently-used keys at 128 MB instead of failing writes.
    # AOF keeps the cache warm across restarts.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (run make init)}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG:-v3.5.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090" # loopback only: reach it through an SSH tunnel
    depends_on:
      - app
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging: *default-logging

  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-12.1.0}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env (run make init)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

networks:
  # Reachable from outside: nginx, app (it must reach the internet to probe monitored links),
  # prometheus and grafana.
  edge: {}
  # Internal only: MongoDB and Redis have no route to or from the internet.
  data:
    internal: true

volumes:
  mongo-data:
  redis-data:
  prometheus-data:
  grafana-data:
