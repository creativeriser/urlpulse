# ---------------------------------------------------------------------------
# URLPulse reverse proxy (nginxinc/nginx-unprivileged, listens on 8080)
#
# Responsibilities: single public entry point, coarse per-IP throttling,
# request-id injection, JSON access logs, and keeping /metrics private.
# The application enforces the precise limits itself (100 writes and 600
# reads per 15 minutes), so nginx only absorbs bursts and abuse.
# ---------------------------------------------------------------------------

# One log line per request as JSON: easy to ship to Loki / ELK later.
log_format json_combined escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","status":$status,'
  '"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time","referer":"$http_referer"}';

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/s;
limit_req_status 429;

upstream urlpulse_app {
  server app:5000 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  access_log /dev/stdout json_combined;
  error_log  /dev/stderr warn;

  # The API takes tiny JSON bodies; refuse anything larger.
  client_max_body_size 16k;
  client_header_timeout 10s;
  client_body_timeout   10s;
  send_timeout          30s;

  # Used by the compose healthcheck. Never proxied, never logged.
  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Prometheus scrapes app:5000/metrics directly on the internal network.
  # Publicly it does not exist.
  location = /metrics {
    return 404;
  }

  location / {
    limit_req zone=per_ip burst=60 nodelay;

    proxy_pass http://urlpulse_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # $http_host keeps the port, so the app can build correct short URLs in dev.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite (do not append): clients must not be able to spoof their IP.
    # If another proxy or load balancer sits in front of this one, switch to
    # $proxy_add_x_forwarded_for and enable the realip module. See DOCUMENTATION.md.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replace any client-supplied id: the app trusts this header for log correlation.
    proxy_set_header X-Request-Id      $request_id;

    proxy_connect_timeout 3s;
    proxy_send_timeout    15s;
    proxy_read_timeout    30s;

    # Retry only connection-level failures. POSTs are never retried by default.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
  }
}
