apiVersion: v1
kind: Namespace
metadata:
  name: urlpulse
  labels:
    # baseline is enforced because the stock MongoDB image starts as root and drops privileges.
    # The app itself already meets "restricted" (non-root, read-only filesystem, no capabilities),
    # and warn: restricted will tell you if anything regresses.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
