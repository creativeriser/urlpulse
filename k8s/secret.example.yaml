# TEMPLATE ONLY. It is deliberately NOT listed in kustomization.yaml, so it can never be applied by accident.
# Create the real secret from your shell instead (nothing lands in git):
#
#   kubectl -n urlpulse create secret generic urlpulse-secrets \
#     --from-literal=HASH_SALT="$(openssl rand -hex 24)" \
#     --from-literal=METRICS_TOKEN="$(openssl rand -hex 24)" \
#     --from-literal=MONGO_ROOT_USER=urlpulse \
#     --from-literal=MONGO_ROOT_PASSWORD="<hex password>" \
#     --from-literal=MONGO_URI="mongodb://urlpulse:<hex password>@mongo:27017/urlpulse?authSource=admin"
#
# For anything beyond a demo, use External Secrets, Sealed Secrets or SOPS rather than plain Secrets.
# METRICS_TOKEN matters here: an Ingress cannot hide /metrics the way the Compose nginx does, so the
# endpoint is protected by a bearer token instead (Prometheus sends it with `authorization.credentials`).
apiVersion: v1
kind: Secret
metadata:
  name: urlpulse-secrets
type: Opaque
stringData:
  HASH_SALT: replace-me-at-least-16-chars
  METRICS_TOKEN: replace-me
  MONGO_ROOT_USER: urlpulse
  MONGO_ROOT_PASSWORD: replace-me
  MONGO_URI: mongodb://urlpulse:replace-me@mongo:27017/urlpulse?authSource=admin
